version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # 1.x reflows inline elements and changes rendered whitespace; stay on 0.14 until that is reviewed.
      - dependency-name: prettier-plugin-astro
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
